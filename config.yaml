poll_interval_seconds: 300
# Slower polling outside weekday business hours — most new internship
# postings land during the day, so there's little to gain (and real
# CPU/network/battery cost, especially from the browser-based sources) in
# polling every 5 minutes at 2am or on a Sunday. See _next_sleep_seconds's
# docstring in alerter.py for exactly how this schedule is computed —
# notably, it's built so a poll never lags into peak hours: if peak time
# is due to start sooner than this interval would otherwise wake up, it
# wakes up right at that moment instead.
# off_peak_poll_interval_seconds: 3600  # disabled: poll every 5 min around the clock
peak_start_hour: 6   # local system time of the machine running the bot
peak_end_hour: 17    # exclusive — 17 means "up to but not including 5pm"
state_path: state.json

