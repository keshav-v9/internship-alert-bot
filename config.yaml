  # --- Browser-based (Playwright/Chromium) — these sites don't expose a
  # plain-HTTP path at all (a CSRF-bound API, a client-side-only search
  # box, or active bot-blocking), so a real browser is launched just for
  # these, once per poll cycle, and closed again right after. See each
  # _fetch_*_jobs_lines docstring in alerter.py for the specific reason
  # per site. Kept last in this file so the lightweight HTTP-based sources
  # above always get checked even if this step is slow or fails outright.
  - type: meta_jobs
    name: "Meta"
    url: "https://www.metacareers.com/jobs?q=intern"
    board_url: "https://www.metacareers.com/jobs?q=intern"

